<div class="contact-form">
    <form action="https://formsubmit.co/websergio@mail.ru" method="POST">
        <!-- Скрытые настройки FormSubmit -->
        <input type="hidden" name="_subject" value="🏠 Новая заявка с сайта tvoydom-54.ru">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://tvoydom-54.ru">
        <input type="text" name="_honey" style="display:none">
        
        <div class="form-group">
            <label for="name">Ваше имя</label>
            <input type="text" id="name" name="Имя" required placeholder="Как к вам обращаться?">
        </div>
        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="Телефон" required placeholder="+7 (___) ___-__-__">
        </div>
        <div class="form-group">
            <label for="service">Что вас интересует?</label>
            <select id="service" name="Услуга">
                <option value="Покупка квартиры">Покупка квартиры</option>
                <option value="Продажа квартиры">Продажа квартиры</option>
                <option value="Помощь с ипотекой">Помощь с ипотекой</option>
                <option value="Консультация">Консультация</option>
            </select>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="agree" name="Согласие" required>
            <label for="agree">Я согласен на обработку персональных данных</label>
        </div>
        <button type="submit" class="btn btn-primary btn-submit">Записаться на консультацию</button>
    </form>
</div>
